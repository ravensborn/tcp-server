services:
  tcp-server:
    image: python:3.12-slim
    container_name: tcp-server
    restart: unless-stopped
    working_dir: /app
    environment:
      - PORT=5027
      # auto = detect Teltonika vs Tekelek TEK 811 per connection
      - PROTOCOL=auto
      - LOG_DIR=/app/data
      # Optional TEK 811 extras:
      # - TANK_HEIGHT_CM=300      # compute fill level from ullage
      - TEK_REPLY=R3=ACTIVE       # activate the unit after its first message
      # - TEK_PASSWORD=TEK811
      # - TEK_REPLY_CRC=0
    volumes:
      - ./server.py:/app/server.py:ro
      - ./data:/app/data
    command: python -u server.py
    ports:
      - "5027:5027"
